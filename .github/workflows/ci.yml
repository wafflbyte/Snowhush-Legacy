name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Simulation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Formatting
        run: |
          cargo fmt --check --manifest-path core/Cargo.toml
          cargo fmt --check --manifest-path windows/Cargo.toml
      - name: Tests
        run: cargo test --locked --manifest-path core/Cargo.toml

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --locked --release --bin Snowhush --manifest-path windows/Cargo.toml
      # The Microsoft Store's package, ready to upload to Partner Center.
      - run: windows/store/pack.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: snowhush-msix
          path: dist/Snowhush.msix

  mac:
    name: Mac app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: swift build -c release
